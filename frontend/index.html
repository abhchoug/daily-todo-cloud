<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily ToDo - Cloud Edition</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <!-- Auth Screen -->
    <div id="authContainer" class="auth-container hidden">
        <div class="auth-box">
            <h1>📝 Daily ToDo</h1>
            <p class="tagline">Cloud-powered task management</p>
            
            <form id="emailForm" class="form-group">
                <input 
                    type="email" 
                    id="email" 
                    placeholder="Email address" 
                    required
                    autocomplete="email"
                >
                <input 
                    type="password" 
                    id="password" 
                    placeholder="Password" 
                    required
                    autocomplete="current-password"
                >
                <button type="submit" id="loginBtn" class="btn btn-primary">Sign In / Sign Up</button>
            </form>

            <div class="divider">or</div>

            <button id="googleBtn" class="btn btn-google">
                <span>🔵 Google</span>
            </button>
            <button id="githubBtn" class="btn btn-github">
                <span>🐙 GitHub</span>
            </button>

            <p class="terms">
                By signing in, you agree to our 
                <a href="#privacy">Privacy Policy</a>
            </p>
        </div>
    </div>

    <!-- App Screen -->
    <div id="appContainer" class="app-container hidden">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <h1>📝 Daily ToDo</h1>
            </div>
            <div class="header-right">
                <span id="userName" class="user-name"></span>
                <button id="logoutBtn" class="btn btn-small">Logout</button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Date Navigation -->
            <div class="date-nav">
                <button id="prevBtn" class="btn-nav">← Previous</button>
                <span id="dateDisplay" class="date-display">Today</span>
                <button id="nextBtn" class="btn-nav">Next →</button>
            </div>

            <!-- Add Task Form -->
            <div class="add-task">
                <input 
                    type="text" 
                    id="taskInput" 
                    placeholder="Add a new task..." 
                    autocomplete="off"
                >
                <button id="addTaskBtn" class="btn btn-primary">Add Task</button>
            </div>

            <!-- Tasks List -->
            <div id="tasksList" class="tasks-list">
                <p class="empty-state">No tasks for this date. Add one to get started!</p>
            </div>
        </main>

        <!-- Statistics (Optional) -->
        <footer class="footer">
            <div class="stats">
                <span id="completedCount">0/0</span> completed today
            </div>
        </footer>
    </div>

    <!-- Loading Indicator -->
    <div id="loadingIndicator" class="loading-indicator hidden">
        <div class="spinner"></div>
    </div>

    <!-- Notification -->
    <div id="notification" class="notification hidden"></div>

    <!-- Scripts -->
    <script src="firebase-config.js"></script>
    <script src="auth.js"></script>
    <script src="app.js"></script>
</body>
</html>
